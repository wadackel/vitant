name: native

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Full validation for daily/release checks; standard matches PR checks
        type: choice
        options: [full, standard]
        default: full

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      reason: ${{ steps.plan.outputs.reason }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      comparison: ${{ steps.plan.outputs.comparison }}
      diff: ${{ steps.plan.outputs.diff }}
      platforms: ${{ steps.plan.outputs.platforms }}
      detail: ${{ steps.plan.outputs.detail }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - id: plan
        env:
          CI_PROFILE: ${{ inputs.profile }}
        run: node bench/ci.ts plan

  quick:
    name: Typecheck and unit tests
    needs: plan
    if: ${{ needs.plan.outputs.profile != 'docs' }}
    runs-on: ubuntu-24.04
    env:
      CI_SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: node bench/ci.ts run quick linux-x64-gnu
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: check-linux-x64-gnu-quick
          path: build/ci/result-*.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: reports-linux-x64-gnu-quick
          path: build/test-reports
          if-no-files-found: ignore
          overwrite: true

  build:
    name: Build and smoke (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.outputs.profile != 'docs' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    env:
      CI_SHA: ${{ needs.plan.outputs.sha }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        if: ${{ !matrix.musl }}
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        if: ${{ !matrix.musl }}
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        if: ${{ matrix.addon && !matrix.musl }}
        with:
          toolchain: stable
      - name: Install
        if: ${{ !matrix.musl }}
        run: pnpm install --frozen-lockfile
      - name: Build addon
        if: ${{ matrix.addon && !matrix.musl }}
        run: |
          pnpm build:native
          node bench/ci.ts stamp-addon "$TARGET"
      - name: Smoke
        if: ${{ !matrix.musl }}
        run: node bench/ci.ts run smoke "$TARGET"
      - name: Build and smoke on Alpine
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -e CI_SHA -e GITHUB_RUN_ID -e TARGET -v "$PWD":/work -w /work node:24-alpine sh -ec '
            apk add --no-cache bash curl gcc git musl-dev tar
            git config --global --add safe.directory /work
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            npm install --global pnpm@12.4.2
            pnpm install --frozen-lockfile
            pnpm build:native
            node bench/ci.ts stamp-addon "$TARGET"
            node bench/ci.ts run smoke "$TARGET"
          '
      - name: Return Alpine reports to the runner
        if: ${{ always() && matrix.musl }}
        run: |
          if [ -d build/test-reports ]; then
            docker run --rm -v "$PWD/build":/artifacts -e REPORT_OWNER="$(id -u):$(id -g)" node:24-alpine \
              sh -ec 'chown -R "$REPORT_OWNER" /artifacts/test-reports'
          fi
      - name: Check platform package contents
        if: ${{ matrix.addon }}
        run: |
          test -f "build/fork.$TARGET.node"
          cp "build/fork.$TARGET.node" "npm/$TARGET/"
          cd "npm/$TARGET"
          npm pack --dry-run 2>&1 | grep -F "fork.$TARGET.node"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ matrix.addon }}
        with:
          name: fork.${{ matrix.target }}
          path: |
            build/fork.${{ matrix.target }}.node
            build/addon.${{ matrix.target }}.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: check-${{ matrix.target }}-smoke
          path: build/ci/result-*.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: reports-${{ matrix.target }}-smoke
          path: build/test-reports
          if-no-files-found: ignore
          overwrite: true

  detail:
    name: ${{ matrix.target }} (${{ matrix.suite }})
    needs: [plan, build]
    if: ${{ needs.plan.outputs.profile != 'docs' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ needs.plan.outputs.profile == 'full' && 240 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.plan.outputs.profile == 'full' && 4 || 20 }}
      matrix: ${{ fromJSON(needs.plan.outputs.detail) }}
    env:
      CI_SHA: ${{ needs.plan.outputs.sha }}
      TARGET: ${{ matrix.target }}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: ${{ matrix.addon }}
        with:
          name: fork.${{ matrix.target }}
          path: build
      - uses: pnpm/action-setup@v6.1.0
        if: ${{ !matrix.musl }}
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install
        if: ${{ !matrix.musl }}
        run: pnpm install --frozen-lockfile
      - name: Validate
        if: ${{ !matrix.musl }}
        timeout-minutes: ${{ needs.plan.outputs.profile == 'full' && 200 || 25 }}
        run: node bench/ci.ts run "$SUITE" "$TARGET"
      - name: Validate on Alpine
        if: ${{ matrix.musl }}
        timeout-minutes: ${{ needs.plan.outputs.profile == 'full' && 200 || 25 }}
        run: |
          docker run --rm -e CI_SHA -e GITHUB_RUN_ID -e TARGET -e SUITE -v "$PWD":/work -w /work node:24-alpine sh -ec '
            apk add --no-cache bash git
            git config --global --add safe.directory /work
            npm install --global pnpm@12.4.2
            pnpm install --frozen-lockfile
            node bench/ci.ts run "$SUITE" "$TARGET"
          '
      - name: Return Alpine reports to the runner
        if: ${{ always() && matrix.musl }}
        run: |
          if [ -d build/test-reports ]; then
            docker run --rm -v "$PWD/build":/artifacts -e REPORT_OWNER="$(id -u):$(id -g)" node:24-alpine \
              sh -ec 'chown -R "$REPORT_OWNER" /artifacts/test-reports'
          fi
      - name: Keep available truth sessions
        if: ${{ always() && startsWith(matrix.suite, 'truth') }}
        run: node bench/ci.ts sessions
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: check-${{ matrix.target }}-${{ matrix.suite }}
          path: build/ci/result-*.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: reports-${{ matrix.target }}-${{ matrix.suite }}
          path: |
            build/test-reports
            build/*.json
          if-no-files-found: ignore
          overwrite: true

  collect:
    name: Validate required results
    needs: [plan, quick, build, detail]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      CI_SHA: ${{ needs.plan.outputs.sha }}
      CI_PROFILE: ${{ needs.plan.outputs.profile }}
      CI_REASON: ${{ needs.plan.outputs.reason }}
      CI_BASE: ${{ needs.plan.outputs.base }}
      CI_HEAD: ${{ needs.plan.outputs.head }}
      CI_COMPARISON: ${{ needs.plan.outputs.comparison }}
      CI_DIFF: ${{ needs.plan.outputs.diff }}
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        if: ${{ needs.plan.outputs.profile != 'docs' }}
        with:
          pattern: check-*
          path: build/ci-results
      - name: Check completeness and identity
        if: ${{ always() }}
        run: node bench/ci.ts gate

  platform:
    name: ${{ matrix.name }}
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [darwin-arm64, darwin-x64, linux-x64-gnu, linux-arm64-gnu, linux-x64-musl, linux-arm64-musl, 'win32-x64, without the addon']
    steps:
      - env:
          RESULT: ${{ needs.collect.result }}
        run: test "$RESULT" = success

  required:
    name: Required validation
    needs: [collect, platform]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          COLLECT: ${{ needs.collect.result }}
          PLATFORM: ${{ needs.platform.result }}
        run: test "$COLLECT" = success && test "$PLATFORM" = success
