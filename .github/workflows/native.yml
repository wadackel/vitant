# Builds the addon that copies a worker process for every platform it has a
# package for, runs the tests with it there, checks every verdict on the
# fixture project against the project's own suite, runs the tool packed and
# installed as a published one would be, and keeps the binaries.
# On Windows, where a process cannot be copied, the same tests and checks run
# without the addon.
name: native

on:
  push:
    branches: [main]
  pull_request:
  # For a branch with no pull request yet.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64-gnu, runner: ubuntu-24.04 }
          - { target: linux-arm64-gnu, runner: ubuntu-24.04-arm }
          - { target: linux-x64-musl, runner: ubuntu-24.04, musl: true }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, musl: true }
    steps:
      - uses: actions/checkout@v7.0.1

      # glibc and macOS: on the runner itself.
      - uses: pnpm/action-setup@v6.1.0
        if: ${{ !matrix.musl }}
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        if: ${{ !matrix.musl }}
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        if: ${{ !matrix.musl }}
        with:
          toolchain: stable
      - name: Build and test
        if: ${{ !matrix.musl }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build:native
          pnpm test
          pnpm test:truth
          pnpm test:packed

      # musl: in an Alpine container started by hand. Actions written in
      # JavaScript do not run inside one on arm64, so only the build and the
      # tests go in.
      - name: Build and test on Alpine
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/work -w /work node:24-alpine sh -ec '
            apk add --no-cache bash curl gcc git musl-dev tar
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            npm install --global pnpm@12.4.2
            pnpm install --frozen-lockfile
            pnpm build:native
            pnpm test
            pnpm test:truth
            pnpm test:packed
          '

      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: test-reports.${{ matrix.target }}
          path: build/test-reports
          if-no-files-found: ignore

      - name: The package for this platform holds what was built
        run: |
          test -f "build/fork.${{ matrix.target }}.node"
          cp "build/fork.${{ matrix.target }}.node" "npm/${{ matrix.target }}/"
          cd "npm/${{ matrix.target }}"
          npm pack --dry-run 2>&1 | grep -F "fork.${{ matrix.target }}.node"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fork.${{ matrix.target }}
          path: build/fork.${{ matrix.target }}.node
          if-no-files-found: error

  windows:
    name: win32-x64, without the addon
    runs-on: windows-2025
    # Starting a process takes long there: the checks against the suite alone took 64 minutes for one pass of the fixture's mutants.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:truth
        # The log of a job that runs out of its own time is not kept; one of a step that does is.
        timeout-minutes: 200
      - run: pnpm test:packed
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: test-reports.win32-x64
          path: build/test-reports
          if-no-files-found: ignore
