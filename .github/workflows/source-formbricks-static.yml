name: formbricks-static-source

on:
  push:
    branches: [experiment/yaml-speed-yaml-witness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node bench/setup.ts formbricks > setup.log 2>&1
      - name: Record full-file source outcomes
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '3'
          BAIL_SUPPLEMENT: '0'
        run: |
          mkdir -p build/source
          git rev-parse HEAD > build/identity.log
          git -C bench/.work/formbricks rev-parse HEAD >> build/identity.log
          node --version >> build/identity.log
          git -C bench/.work/formbricks status --porcelain > build/status-before.txt
          node bench/formbricks-static-source/batch-check.mjs "$PWD/bench/.work/formbricks/apps/web" "$PWD/build/source" "$PWD/bench/formbricks-static-source/manifest.json" > build/driver.log 2>&1
          git -C bench/.work/formbricks status --porcelain > build/status-after.txt
          cmp build/status-before.txt build/status-after.txt
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const summary = JSON.parse(fs.readFileSync('build/source/summary.json', 'utf8'))
          assert.equal(summary.exitCode, 0)
          assert.equal(summary.cases.length, 10)
          for (const row of summary.cases) {
            assert(row.restored)
            assert.equal(row.original.code, 0)
            assert.equal(row.assessment.status, 'verified-named-failure')
          }
          console.log(JSON.stringify({ cases: summary.cases.length, restored: true }))
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: formbricks-static-source-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            setup.log
            build/identity.log
            build/status-*.txt
            build/driver.log
            build/source
          if-no-files-found: error
