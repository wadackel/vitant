name: yaml-source-batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node bench/setup.ts yaml > setup.log 2>&1
      - name: Verify source-written failures
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '2'
        run: |
          mkdir -p build/batch
          git rev-parse HEAD > build/identity.log
          git -C bench/.work/yaml rev-parse HEAD >> build/identity.log
          node --version >> build/identity.log
          git -C bench/.work/yaml status --porcelain > build/status-before.txt
          node bench/yaml-source-evidence/batch-check.mjs "$PWD/bench/.work/yaml" "$PWD/build/batch" "$PWD/bench/yaml-source-evidence/batch-cases.json" > build/driver.log 2>&1
          git -C bench/.work/yaml status --porcelain > build/status-after.txt
          cmp build/status-before.txt build/status-after.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: yaml-source-batch-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            setup.log
            build/identity.log
            build/status-*.txt
            build/driver.log
            build/batch
          if-no-files-found: error
