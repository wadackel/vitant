# Full scopes occupy runners for hours; starting them on every main push
# would delay pull-request checks on the same runners.
name: bench

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check that every target this workflow lists still sets up and starts - this tool alone over a share of each scope on Linux, whatever tools, runs, runners and jobs say
        type: boolean
        default: false
      tools:
        description: Tools to run, as bench/run.ts takes them
        default: stryker,vitant-no-clone,vitant
      runs:
        description: Times each tool is run; docs/benchmark.md takes the middle one of three
        default: '1'
      math:
        description: Also run excalidraw math, which takes over an hour on four cores
        type: boolean
        default: false
      only:
        description: Targets to run, separated by spaces; all of them when empty
        default: ''
      ref:
        description: Commit of this tool to measure; the one the workflow is started from when empty
        default: ''
      limit:
        description: Minutes after which a run of this tool is ended as one that hangs, where the target sets no longer limit of its own
        default: '150'
      base:
        description: Commit of this tool to run as vitant-base, for comparing two commits in one job
        default: ''
      records:
        description: Keep what the workers wrote down in the last run of each tool, for reading a slow run
        type: boolean
        default: false
      runners:
        description: Runners to run on, separated by spaces
        default: ubuntu-24.04 macos-15
      jobs:
        description: Jobs each scope is run in, each making its own runs; the applications take hours a run
        default: '1'
      slots:
        description: macOS jobs of every bench run together that may run at once, out of the five the account runs; the rest stay free for pull requests
        default: '2'

permissions:
  contents: read

# One group for every manual run would discard measurements of other commits or scopes.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}-${{ inputs.check }}-${{ inputs.tools }}-${{ inputs.ref }}-${{ inputs.only }}-${{ inputs.base }}-${{ inputs.runners }}-${{ inputs.jobs }}
  cancel-in-progress: true

jobs:
  # Runners differ by half in speed from one job to the next, so a time says
  # something of a change only beside one of another commit taken on the
  # same model of processor, which the summary names. That takes starting
  # the targets in question twice rather than all of them.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          RUNNERS: ${{ inputs.check && 'ubuntu-24.04' || inputs.runners || 'ubuntu-24.04 macos-15' }}
          JOBS: ${{ inputs.check && '1' || inputs.jobs || '1' }}
          SLOTS: ${{ inputs.slots || '2' }}
          ALL: |
            ufo all
            zustand all
            es-toolkit array
            immer all
            pinia pinia
            jotai vanilla
            query core
            hono router
            hono utils
            excalidraw pr
            vue reactivity
            solid reactive
            pacer timing
            xstate core
            valibot schemas
            shiki transformers
            effect data
            h3 utils
            es-toolkit pr
            vue pr
            i18next translation
            yaml lexer
            date-fns dates
            secretlint messages
            cspell distance
            commitlint lint
            umami lib
            formbricks utils
            actual server 159
            immich utils 113
            immich services 187
            roo-code utils
            koel composables
            homepage utils
            tailwindcss parsers 189
            sentry utils
            lobehub topic 87
            shopify node
            promptfoo assertions
            comfyui stores
            freelens utils 209
            n8n proxy
            headlamp api 216
            zod core
            vercel-ai node
            vercel-ai-edge edge
            sveltekit server
            renovate util
            lint-staged lib 101
            happy-dom selectors
            mikro-orm core 79
            coder agents
            element-plus table 145
            element-plus hooks 112
            fast-check check 142
        # A number after a scope is its macOS job's usual minutes, where that is over an hour.
        # Each macOS job is dealt a slot, the longest first to the slot with the least work, and
        # the run job waits for its slot's concurrency group, which every bench run shares: a
        # run's max-parallel would bound one run only, and two or three runs at once were what
        # held pull requests' macOS jobs back. A slot that empties does not take another's jobs,
        # so dealing them in turn would leave one slot with all five longest scopes.
        run: |
          node -e '
            const only = process.env.ONLY.split(/\s+/).filter(Boolean)
            const all = process.env.ALL.trim().split("\n").map((line) => line.trim().split(" "))
            const bench = all.filter(([target]) => only.length === 0 || only.includes(target)).map(([target, scope, minutes]) => ({ target, scope, minutes: Number(minutes ?? 15) }))
            const runners = process.env.RUNNERS.split(/\s+/).filter(Boolean)
            const jobs = Array.from({ length: Number(process.env.JOBS) }, (_, i) => i + 1)
            const slots = Number(process.env.SLOTS)
            if (!Number.isInteger(slots) || slots < 1) throw new Error(`slots must be a whole number of at least 1, not ${process.env.SLOTS}`)
            const include = runners.flatMap((runner) => bench.flatMap(({ target, scope, minutes }) => jobs.map((job) => ({ runner, bench: { target, scope }, job, slot: 0, minutes }))))
            const load = Array(slots).fill(0)
            const count = Array(slots).fill(0)
            for (const entry of include.filter((entry) => entry.runner.startsWith("macos")).sort((a, b) => b.minutes - a.minutes)) {
              const slot = load.indexOf(Math.min(...load))
              load[slot] += entry.minutes
              count[slot]++
              entry.slot = slot + 1
            }
            // A concurrency group keeps at most 100 jobs waiting, over every run, and cancels any beyond.
            if (Math.max(...count) > 100) throw new Error(`${Math.max(...count)} macOS jobs would wait for one slot, over the 100 a concurrency group keeps; raise slots or run fewer`)
            console.log("matrix=" + JSON.stringify({ include: include.map(({ minutes, ...entry }) => entry) }))
          ' >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (${{ matrix.runner }}, ${{ matrix.job }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    # StrykerJS took 315 minutes on actual on macOS.
    timeout-minutes: ${{ inputs.check && 100 || 360 }}
    concurrency:
      group: ${{ matrix.slot && format('bench-macos-{0}', matrix.slot) || format('bench-{0}-{1}', github.run_id, strategy.job-index) }}
      queue: max
    strategy:
      fail-fast: false
      # The check leaves most of the account's runners to the pull requests that come while it runs.
      max-parallel: ${{ inputs.check && 6 || 256 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - uses: actions/checkout@v7.0.1
        if: ${{ inputs.base }}
        with:
          ref: ${{ inputs.base }}
          path: base
          persist-credentials: false
      - name: Build the tool to compare with
        if: ${{ inputs.base }}
        run: |
          ln -s ../node_modules base/node_modules
          cd base && pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        # A check that hangs is to end failed, not cancelled as a job its own limit ends does,
        # and the step's limit leaves the summary and the upload their minutes.
        timeout-minutes: ${{ inputs.check && 80 || 360 }}
        env:
          VITANT_BASE: ${{ inputs.base && format('{0}/base', github.workspace) || '' }}
          TOOLS: ${{ inputs.check && 'vitant' || inputs.tools || 'vitant' }}
          RUNS: ${{ inputs.check && '1' || inputs.runs || '1' }}
          # A share of the files rather than none: with no mutant this tool ends before it starts Vitest.
          # The first share is never empty, holding the file with the most mutants.
          SHARD: ${{ inputs.check && '1/64' || '' }}
          # On Linux, the longest run of this tool but actual's, freelens's, headlamp's and fast-check's, one that starts a worker for every run of a file, took 106 minutes; actual's took 185 on an EPYC 7763, freelens's 133, headlamp's 131 and fast-check's 119. On macOS immich services' took 193, freelens's 200, and headlamp's 268 to past 345 with three workers and 231 and 257, twice past 345, with the two its target gives this tool on three processors. Each of these sets a limit of its own; on macOS headlamp's run does not always end within its 300 minutes, nor within a job's six hours with a longer one.
          LIMIT: ${{ inputs.limit || '150' }}
        run: |
          # Identical runs on two runners can differ twofold, the work in copies
          # of a process slowing down where nothing else does: what a copy pays
          # here, and the processes and memory as the run goes, are kept with the records.
          ${{ inputs.records && 'node --max-old-space-size=4096 bench/forkcost.mjs build/fork.*.node > machine.log 2>&1 || true' || '' }}
          ${{ inputs.records && 'bench/machine.sh >> machine.log 2>&1 &' || '' }}
          node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS" --runs "$RUNS" --limit "$LIMIT" ${SHARD:+--shard "$SHARD"} ${{ inputs.records && '--records' || '' }}
      - name: Keep the machine's log
        if: ${{ always() && inputs.records }}
        run: |
          mkdir -p "bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}"
          if [ -f machine.log ]; then mv machine.log "bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}/"; fi
      # Also after the job's own limit has ended it, which counts as cancelled: bench/run.ts
      # writes the summary before each run, so the processor and what was done are not lost.
      - name: Summary
        if: ${{ always() && hashFiles(format('bench/results/{0}-{1}/summary.json', matrix.bench.target, matrix.bench.scope)) != '' }}
        run: |
          node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-${{ matrix.runner }}-${{ matrix.job }}
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}

  long:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (ubuntu-24.04)
    if: ${{ inputs.math && !inputs.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        bench:
          # svelte sources is not here: the two test files it runs one process at a
          # time were not through after the 350 minutes a job is given.
          - { target: excalidraw, scope: math }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        env:
          TOOLS: ${{ inputs.tools }}
        run: node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS"
      - name: Summary
        if: ${{ always() && hashFiles(format('bench/results/{0}-{1}/summary.json', matrix.bench.target, matrix.bench.scope)) != '' }}
        run: node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-ubuntu-24.04
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}
