# Full scopes occupy runners for hours; starting them on every main push
# would delay pull-request checks on the same runners.
name: bench

on:
  workflow_dispatch:
    inputs:
      tools:
        description: Tools to run, as bench/run.ts takes them
        default: stryker,vitant-no-clone,vitant
      runs:
        description: Times each tool is run; docs/benchmark.md takes the middle one of three
        default: '1'
      math:
        description: Also run excalidraw math, which takes over an hour on four cores
        type: boolean
        default: false
      only:
        description: Targets to run, separated by spaces; all of them when empty
        default: ''
      ref:
        description: Commit of this tool to measure; the one the workflow is started from when empty
        default: ''
      limit:
        description: Minutes after which a run of this tool is ended as one that hangs
        default: '150'
      base:
        description: Commit of this tool to run as vitant-base, for comparing two commits in one job
        default: ''
      records:
        description: Keep what the workers wrote down in the last run of each tool, for reading a slow run
        type: boolean
        default: false
      runners:
        description: Runners to run on, separated by spaces
        default: ubuntu-24.04 macos-15
      jobs:
        description: Jobs each scope is run in, each making its own runs; the applications take hours a run
        default: '1'

permissions:
  contents: read

# One group for every manual run would discard measurements of other commits or scopes.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tools }}-${{ inputs.ref }}-${{ inputs.only }}-${{ inputs.base }}-${{ inputs.runners }}-${{ inputs.jobs }}
  cancel-in-progress: true

jobs:
  # Runners differ by half in speed from one job to the next, so a time says
  # something of a change only beside one of another commit taken on the
  # same model of processor, which the summary names. That takes starting
  # the targets in question twice rather than all of them.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      bench: ${{ steps.pick.outputs.bench }}
      runners: ${{ steps.pick.outputs.runners }}
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          RUNNERS: ${{ inputs.runners || 'ubuntu-24.04 macos-15' }}
          JOBS: ${{ inputs.jobs || '1' }}
          ALL: |
            ufo all
            zustand all
            es-toolkit array
            immer all
            pinia pinia
            jotai vanilla
            query core
            hono router
            hono utils
            excalidraw pr
            vue reactivity
            solid reactive
            pacer timing
            xstate core
            valibot schemas
            shiki transformers
            effect data
            h3 utils
            es-toolkit pr
            vue pr
            umami lib
            formbricks utils
            actual server
            immich utils
            immich services
            roo-code utils
        run: |
          node -e '
            const only = process.env.ONLY.split(/\s+/).filter(Boolean)
            const all = process.env.ALL.trim().split("\n").map((line) => line.trim().split(" "))
            const bench = all.filter(([target]) => only.length === 0 || only.includes(target)).map(([target, scope]) => ({ target, scope }))
            console.log("bench=" + JSON.stringify(bench))
            console.log("runners=" + JSON.stringify(process.env.RUNNERS.split(/\s+/).filter(Boolean)))
            console.log("jobs=" + JSON.stringify(Array.from({ length: Number(process.env.JOBS) }, (_, i) => i + 1)))
          ' >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (${{ matrix.runner }}, ${{ matrix.job }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    # StrykerJS took 315 minutes on actual on macOS.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
        bench: ${{ fromJSON(needs.plan.outputs.bench) }}
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - uses: actions/checkout@v7.0.1
        if: ${{ inputs.base }}
        with:
          ref: ${{ inputs.base }}
          path: base
      - name: Build the tool to compare with
        if: ${{ inputs.base }}
        run: |
          ln -s ../node_modules base/node_modules
          cd base && pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        env:
          VITANT_BASE: ${{ inputs.base && format('{0}/base', github.workspace) || '' }}
          TOOLS: ${{ inputs.tools || 'vitant' }}
          RUNS: ${{ inputs.runs || '1' }}
          # The longest run of this tool here, one that starts a worker for every run of a file, took 106 minutes.
          LIMIT: ${{ inputs.limit || '150' }}
        run: |
          # Identical runs on two runners can differ twofold, the work in copies
          # of a process slowing down where nothing else does: what a copy pays
          # here, and the processes and memory as the run goes, are kept with the records.
          ${{ inputs.records && 'node --max-old-space-size=4096 bench/forkcost.mjs build/fork.*.node > machine.log 2>&1 || true' || '' }}
          ${{ inputs.records && 'bench/machine.sh >> machine.log 2>&1 &' || '' }}
          node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS" --runs "$RUNS" --limit "$LIMIT" ${{ inputs.records && '--records' || '' }}
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f machine.log ]; then mv machine.log "bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}/"; fi
          node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-${{ matrix.runner }}-${{ matrix.job }}
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}

  long:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (ubuntu-24.04)
    if: ${{ inputs.math }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        bench:
          # svelte sources is not here: the two test files it runs one process at a
          # time were not through after the 350 minutes a job is given.
          - { target: excalidraw, scope: math }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        env:
          TOOLS: ${{ inputs.tools }}
        run: node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS"
      - name: Summary
        if: ${{ !cancelled() }}
        run: node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-ubuntu-24.04
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}
