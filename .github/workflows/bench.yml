# Runs the benchmark targets on the hosted runners: whether this tool's
# verdicts are those the targets' own suites give, as recorded under
# bench/truth, and how long it takes there. A push runs this tool alone;
# StrykerJS and the tool without copies of a worker take several times as
# long and run when the workflow is started by hand, which is also where the
# times in the README come from.
name: bench

on:
  workflow_dispatch:
    inputs:
      tools:
        description: Tools to run, as bench/run.ts takes them
        default: stryker,vitant-no-clone,vitant
      runs:
        description: Times each tool is run; the README takes the middle one of three
        default: '1'
      math:
        description: Also run excalidraw math and svelte sources, which take hours on four cores
        type: boolean
        default: false
      only:
        description: Targets to run, separated by spaces; all of them when empty
        default: ''
      ref:
        description: Commit of this tool to measure; the one the workflow is started from when empty
        default: ''
      limit:
        description: Minutes after which a run of this tool is ended as one that hangs
        default: '150'
      base:
        description: Commit of this tool to run as vitant-base, for comparing two commits in one job
        default: ''
  push:
    branches: [main]
    paths:
      - src/**
      - native/**
      - bench/**
      - .github/workflows/bench.yml

permissions:
  contents: read

# A push ends the run of the push before it, and leaves alone a run started by hand, which is what the README's times are taken from.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tools }}-${{ inputs.ref }}-${{ inputs.only }}-${{ inputs.base }}
  cancel-in-progress: true

jobs:
  # Runners differ by half in speed from one job to the next, so a time says
  # something of a change only beside one of another commit taken on the
  # same model of processor, which the summary names. That takes starting
  # the targets in question twice rather than all of them.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      bench: ${{ steps.pick.outputs.bench }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
          ALL: |
            ufo all
            zustand all
            es-toolkit array
            immer all
            pinia pinia
            jotai vanilla
            query core
            hono router
            hono utils
            excalidraw pr
            vue reactivity
            solid reactive
            pacer timing
            xstate core
            valibot schemas
            shiki transformers
            effect data
            h3 utils
            es-toolkit pr
            vue pr
        run: |
          node -e '
            const only = process.env.ONLY.split(/\s+/).filter(Boolean)
            const all = process.env.ALL.trim().split("\n").map((line) => line.trim().split(" "))
            const bench = all.filter(([target]) => only.length === 0 || only.includes(target)).map(([target, scope]) => ({ target, scope }))
            console.log("bench=" + JSON.stringify(bench))
          ' >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (${{ matrix.runner }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
        bench: ${{ fromJSON(needs.plan.outputs.bench) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.base }}
        with:
          ref: ${{ inputs.base }}
          path: base
      - name: Build the tool to compare with
        if: ${{ inputs.base }}
        run: |
          ln -s ../node_modules base/node_modules
          cd base && pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        env:
          VITANT_BASE: ${{ inputs.base && format('{0}/base', github.workspace) || '' }}
          TOOLS: ${{ inputs.tools || 'vitant' }}
          RUNS: ${{ inputs.runs || '1' }}
          # The longest run of this tool here, one that starts a worker for every run of a file, took 106 minutes.
          LIMIT: ${{ inputs.limit || '150' }}
        run: node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS" --runs "$RUNS" --limit "$LIMIT"
      - name: Summary
        if: ${{ !cancelled() }}
        run: node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-${{ matrix.runner }}
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}

  long:
    name: ${{ matrix.bench.target }} ${{ matrix.bench.scope }} (ubuntu-24.04)
    if: ${{ inputs.math }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        bench:
          - { target: excalidraw, scope: math }
          - { target: svelte, scope: sources }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:native
      - name: Set up ${{ matrix.bench.target }}
        run: node bench/setup.ts "${{ matrix.bench.target }}" > setup.log 2>&1 || { tail -n 80 setup.log; exit 1; }
      - name: Run
        env:
          TOOLS: ${{ inputs.tools }}
        run: node bench/run.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" --tool "$TOOLS"
      - name: Summary
        if: ${{ !cancelled() }}
        run: node bench/summary.ts "${{ matrix.bench.target }}" "${{ matrix.bench.scope }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.bench.target }}-${{ matrix.bench.scope }}-ubuntu-24.04
          path: bench/results/${{ matrix.bench.target }}-${{ matrix.bench.scope }}
