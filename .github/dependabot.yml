version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Every update edits actions.lock, so a change to it on main makes every open
    # one conflict and be rebased, and each rebase runs the whole PR CI with seven
    # macOS jobs, of the five the account runs at once.
    groups:
      actions:
        patterns:
          - '*'
